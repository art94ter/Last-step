<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Последний шаг</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overflow:hidden}body{display:flex;justify-content:center}#app{width:min(100vw,620px);min-height:100dvh;padding:16px 14px}header{display:flex;justify-content:space-between}h1{font-size:27px;margin:0;font-weight:900}#status,#hint{color:#8e99aa;font-size:13px}#time{font-weight:800;font-size:19px}#game{position:relative;margin:12px auto 8px;width:min(94vw,560px);aspect-ratio:9/13;max-height:69dvh}#board{width:100%;height:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(13,1fr);gap:4px;touch-action:none}.tile{background:#283140;border-radius:8px;box-shadow:inset 0 -2px #0003}.crack{background:#b9513f!important;animation:pulse .45s infinite alternate}.crack:after{content:attr(data-t);display:grid;place-items:center;height:100%;font-size:10px;font-weight:900}.gone{opacity:.07;background:#000!important;transform:scale(.72)}@keyframes pulse{to{background:#e4a23b}}#players{position:absolute;inset:0;pointer-events:none}.player{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #10131a;display:grid;place-items:center;font-size:11px;font-weight:900;transition:left .13s,top .13s,transform .13s}.human{box-shadow:0 0 20px #59b6ffdd,0 0 4px #fff}.dead{opacity:0;transform:translate(-50%,-50%) scale(.2)}#controls{display:flex;gap:8px;justify-content:center}.ctrl{width:57px;height:49px;border-radius:15px;background:#171c27;color:#fff;border:1px solid #2c3545;font-size:22px}#playersInfo{text-align:center;color:#c8ced8;font-size:13px;margin:5px}#hint{text-align:center;margin-top:8px}#overlay,#menu{position:absolute;inset:0;background:#090b10ee;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.card{background:#171c27;border:1px solid #2b3443;border-radius:24px;padding:26px 20px;text-align:center;width:min(92vw,430px)}.card h2{font-size:30px;margin:0 0 8px}.card p{color:#8e99aa;margin:0 0 18px}button{border:0;border-radius:15px;padding:14px 20px;font-size:16px;font-weight:800}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.count button{background:#202735;color:#fff;border:1px solid #344054;padding:13px 0}.count .selected{background:#fff;color:#111}#start,#again{width:100%}
</style></head><body><div id="app"><header><div><h1>ПОСЛЕДНИЙ ШАГ</h1><div id="status">Выбери количество игроков</div></div><div id="time">0:00</div></header>
<div id="game"><div id="board"></div><div id="players"></div>
<div id="overlay"><div class="card"><h2 id="result"></h2><p id="sub"></p><button id="again">Играть снова</button></div></div>
<div id="menu" style="display:flex"><div class="card"><h2>Последний шаг</h2><p>Сколько игроков участвует?</p><div class="count"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4" class="selected">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button></div><button id="start">Начать матч</button></div></div></div>
<div id="playersInfo">4 игрока • 1 человек + 3 бота</div><div id="controls"><button class="ctrl" data-d="left">←</button><button class="ctrl" data-d="up">↑</button><button class="ctrl" data-d="down">↓</button><button class="ctrl" data-d="right">→</button></div><div id="hint">Свайп по полю или кнопки • R — меню</div>
<script>
const C=9,R=13,CR=.72,MI=.19,colors=['#59b6ff','#ff5c73','#ffd45a','#b978ff','#55e39a','#ff914d','#58e1dd','#f78fb3'];let n=4,t=[],ps=[],over=0,win=-1,st=0,last=0;
const board=document.querySelector('#board'),layer=document.querySelector('#players'),game=document.querySelector('#game'),menu=document.querySelector('#menu'),overlay=document.querySelector('#overlay'),time=document.querySelector('#time'),info=document.querySelector('#playersInfo');
const ix=(x,y)=>y*C+x,inside=(x,y)=>x>=0&&x<C&&y>=0&&y<R;
function starts(){return [[1,1],[7,1],[1,11],[7,11],[4,1],[4,11],[1,6],[7,6]].slice(0,n)}
function newGame(){t=Array.from({length:C*R},()=>({s:0,t:0}));ps=starts().map((q,i)=>({id:i,x:q[0],y:q[1],a:1,cd:0,tx:q[0],ty:q[1],chg:.3+Math.random()*.7}));over=0;win=-1;st=performance.now();last=st;menu.style.display='none';overlay.style.display='none';info.textContent=n+' игрока'+(n>1?'':'')+' • 1 человек + '+(n-1)+' бот'+(n-1==1?'':'а');draw()}
function move(p,dx,dy){if(!p.a||p.cd>0)return;let x=p.x+dx,y=p.y+dy;if(!inside(x,y)||t[ix(x,y)].s==2)return;p.x=x;p.y=y;p.cd=MI;if(t[ix(x,y)].s==0){t[ix(x,y)].s=1;t[ix(x,y)].t=CR}}
function human(d){let dx=0,dy=0;if(d=='left')dx=-1;if(d=='right')dx=1;if(d=='up')dy=-1;if(d=='down')dy=1;move(ps[0],dx,dy)}
function bot(p,dt){p.cd=Math.max(0,p.cd-dt);p.chg-=dt;if(p.cd>0)return;if(p.chg<=0){p.chg=.25+Math.random()*.7;let a=[];for(let k=0;k<12;k++){let x=Math.max(0,Math.min(C-1,p.x+Math.floor(Math.random()*7)-3)),y=Math.max(0,Math.min(R-1,p.y+Math.floor(Math.random()*7)-3));if(t[ix(x,y)].s!=2)a.push([x,y,(t[ix(x,y)].s==0?3:0)-Math.abs(x-p.x)-Math.abs(y-p.y)])}a.sort((a,b)=>b[2]-a[2]);let q=a[Math.floor(Math.random()*Math.min(3,a.length))];if(q){p.tx=q[0];p.ty=q[1]}}let dx=Math.sign(p.tx-p.x),dy=Math.sign(p.ty-p.y);if(Math.abs(p.tx-p.x)>Math.abs(p.ty-p.y))dy=0;else dx=0;if(Math.random()<.12){let d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];dx=d[0];dy=d[1]}move(p,dx,dy)}
function draw(){board.innerHTML='';t.forEach(q=>{let e=document.createElement('div');e.className='tile '+(q.s==1?'crack ':'')+(q.s==2?'gone':'');if(q.s==1)e.dataset.t=q.t.toFixed(1);board.appendChild(e)});layer.innerHTML='';ps.forEach(p=>{let e=document.createElement('div');e.className='player '+(p.id==0?'human ':'')+(p.a?'':'dead');e.style.background=colors[p.id];e.textContent=p.id+1;e.style.left=((p.x+.5)/C*100)+'%';e.style.top=((p.y+.5)/R*100)+'%';layer.appendChild(e)})}
function loop(ts){let dt=Math.min(.05,(ts-last)/1000);last=ts;if(!over&&menu.style.display=='none'){t.forEach(q=>{if(q.s==1){q.t-=dt;if(q.t<=0)q.s=2}});ps.forEach(p=>{if(p.a){if(p.id==0)p.cd=Math.max(0,p.cd-dt);else bot(p,dt);if(t[ix(p.x,p.y)].s==2)p.a=0}});let a=ps.filter(p=>p.a);if(a.length<=1){over=1;win=a.length?a[0].id:-1;document.querySelector('#result').textContent=win>=0?'ИГРОК '+(win+1)+' ПОБЕДИЛ':'НИЧЬЯ';document.querySelector('#sub').textContent=win==0?'Ты остался последним!':'Следующий раунд?';overlay.style.display='flex'}time.textContent=Math.floor((ts-st)/60000)+':'+String(Math.floor(ts/1000)%60).padStart(2,'0');draw()}requestAnimationFrame(loop)}
document.querySelectorAll('.count button').forEach(b=>b.onclick=()=>{n=+b.dataset.n;document.querySelectorAll('.count button').forEach(x=>x.classList.toggle('selected',x==b))});
document.querySelector('#start').onclick=newGame;document.querySelector('#again').onclick=newGame;document.querySelectorAll('.ctrl').forEach(b=>b.onpointerdown=()=>human(b.dataset.d));
let sx=0,sy=0;game.ontouchstart=e=>{let q=e.changedTouches[0];sx=q.clientX;sy=q.clientY};game.ontouchend=e=>{let q=e.changedTouches[0],dx=q.clientX-sx,dy=q.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>30)human(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};
window.onkeydown=e=>{let k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')human('left');if(k=='arrowright'||k=='d')human('right');if(k=='arrowup'||k=='w')human('up');if(k=='arrowdown'||k=='s')human('down');if(k=='r')menu.style.display='flex'};requestAnimationFrame(loop);
</script></body></html>
